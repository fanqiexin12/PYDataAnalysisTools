<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 数据处理命令速查</title>
    <meta name="description" content="离线Python数据处理指令查询页，覆盖pandas、numpy、scipy、seaborn和matplotlib的常用写法。">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f3efe8;
            --bg-deep: #e4ddd2;
            --panel: rgba(251, 249, 244, 0.9);
            --surface: rgba(255, 255, 255, 0.52);
            --text: #13212a;
            --muted: #5c6a72;
            --accent: #1f6f78;
            --accent-soft: rgba(31, 111, 120, 0.12);
            --warm: #b9793e;
            --line: rgba(24, 35, 45, 0.12);
            --shadow: 0 24px 50px rgba(37, 35, 28, 0.08);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
        body::before {
            content: ""; position: fixed; inset: 0; pointer-events: none;
            background: radial-gradient(circle at top left, rgba(31, 111, 120, 0.12), transparent 24%),
                        radial-gradient(circle at 100% 0%, rgba(185, 121, 62, 0.12), transparent 20%),
                        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        }
        .sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; position: sticky; top: 0; height: 100vh; backdrop-filter: blur(14px); }
        .sidebar-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
        .sidebar-header h1 { font-size: 20px; font-weight: 700; color: var(--accent); }
        .sidebar-header p { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .nav-list { flex: 1; overflow-y: auto; padding: 12px 0; }
        .nav-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 14px; transition: all 0.18s ease; }
        .nav-item:hover { background: rgba(255,255,255,0.56); }
        .nav-item.active { background: var(--accent); color: #fff; }
        .nav-item .count { font-size: 12px; background: rgba(19, 33, 42, 0.08); padding: 2px 8px; border-radius: 10px; }
        .nav-item.active .count { background: rgba(255,255,255,0.2); color: #fff; }
        .stats { padding: 16px 20px; background: rgba(255,255,255,0.42); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        .search-bar { padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); display: flex; gap: 12px; align-items: center; }
        .search-input { flex: 1; padding: 12px 16px; font-size: 15px; border: 1px solid var(--line); border-radius: var(--radius-md); outline: none; background: rgba(255,255,255,0.8); transition: all 0.15s; }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .clear-btn { padding: 8px 16px; font-size: 13px; background: rgba(255,255,255,0.56); border: 1px solid var(--line); border-radius: var(--radius-md); cursor: pointer; transition: all 0.15s; }
        .clear-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .category-bar { padding: 12px 24px; background: rgba(255,255,255,0.32); border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
        .category-chip { padding: 6px 14px; font-size: 12px; background: rgba(255,255,255,0.56); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: all 0.15s; }
        .category-chip:hover { border-color: var(--accent); }
        .category-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .content { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; transition: all 0.2s; backdrop-filter: blur(14px); }
        .card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
        .card-header { padding: 16px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.42); }
        .card-title { font-size: 15px; font-weight: 700; color: var(--accent); font-family: 'SF Mono', Monaco, monospace; }
        .card-meta { display: flex; gap: 6px; align-items: center; }
        .badge { padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
        .badge-library { background: var(--accent-soft); color: var(--accent); }
        .badge-category { background: rgba(185, 121, 62, 0.12); color: var(--warm); }
        .card-actions { display: flex; gap: 8px; align-items: center; }
        .btn { padding: 6px 12px; font-size: 12px; background: rgba(255,255,255,0.56); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; transition: all 0.15s; }
        .btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn.copied { background: #34c759; color: #fff; border-color: #34c759; }
        .card-desc { padding: 0 20px 12px; font-size: 14px; color: var(--muted); }
        .card-syntax { margin: 0 20px 12px; padding: 10px 12px; background: rgba(18, 29, 37, 0.96); border-radius: var(--radius-md); font-family: 'SF Mono', Monaco, monospace; font-size: 12px; color: #eef6f8; overflow-x: auto; }
        .card-detail { display: none; padding: 0 20px 20px; border-top: 1px solid var(--line); }
        .card.expanded .card-detail { display: block; }
        .card-detail-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 16px 0 10px; display: flex; align-items: center; gap: 6px; }
        .param-item { display: flex; padding: 8px 0; font-size: 13px; border-bottom: 1px solid rgba(24, 35, 45, 0.06); }
        .param-item:last-child { border-bottom: none; }
        .param-name { font-family: 'SF Mono', Monaco, monospace; color: var(--accent); min-width: 130px; flex-shrink: 0; font-weight: 600; }
        .param-desc { color: var(--muted); line-height: 1.5; }
        .card-example { background: #1d1d1f; color: #f5f5f7; padding: 14px; border-radius: var(--radius-md); font-family: 'SF Mono', Monaco, monospace; font-size: 12px; overflow-x: auto; white-space: pre-wrap; line-height: 1.6; }
        .card-example-label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin: 14px 0 8px; font-weight: 700; letter-spacing: 0.08em; }
        .chart-preview { background: rgba(248, 250, 249, 0.8); border-radius: var(--radius-md); padding: 16px; margin: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .chart-preview svg { width: 100%; max-width: 280px; height: auto; }
        .chart-preview-title { font-size: 12px; color: var(--muted); font-weight: 600; }
        .chart-preview-note { font-size: 11px; color: var(--muted); opacity: 0.7; text-align: center; }
        .workflow-section { background: rgba(31, 111, 120, 0.06); border-radius: var(--radius-md); padding: 12px; margin: 12px 0; }
        .workflow-title { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
        .tip-section { background: rgba(185, 121, 62, 0.08); border-radius: var(--radius-md); padding: 12px; margin: 12px 0; }
        .tip-title { font-size: 12px; font-weight: 700; color: var(--warm); margin-bottom: 8px; }
        .tip-list { font-size: 12px; color: var(--muted); line-height: 1.6; padding-left: 16px; }
        .tip-list li { margin-bottom: 4px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
        .expand-hint { font-size: 11px; color: var(--muted); }
        /* 增强参数展示样式 */
        .param-card { background: rgba(255,255,255,0.6); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; margin: 10px 0; }
        .param-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
        .param-name-tag { font-family: 'SF Mono', Monaco, monospace; font-weight: 700; color: var(--accent); font-size: 13px; }
        .param-type-tag { background: rgba(31,111,120,0.1); color: var(--accent); font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
        .param-required-badge { background: #d9534f; color: #fff; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }
        .param-optional-badge { background: rgba(92,106,114,0.2); color: var(--muted); font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }
        .param-default { background: rgba(185,121,62,0.12); color: var(--warm); font-size: 11px; padding: 2px 8px; border-radius: 4px; font-family: 'SF Mono', Monaco, monospace; }
        .param-meaning { color: var(--text); font-size: 13px; line-height: 1.5; margin: 4px 0 8px; }
        .param-detail { color: var(--muted); font-size: 12px; line-height: 1.6; padding-left: 12px; border-left: 2px solid var(--accent-soft); margin-top: 6px; }
        .full-params-toggle { background: rgba(31,111,120,0.08); border: 1px solid rgba(31,111,120,0.2); border-radius: var(--radius-md); padding: 8px 14px; font-size: 12px; color: var(--accent); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; margin-top: 12px; }
        .full-params-toggle:hover { background: rgba(31,111,120,0.15); }
        .full-params-toggle svg { transition: transform 0.2s; }
        .full-params-toggle.expanded svg { transform: rotate(180deg); }
        .full-params-section { display: none; margin-top: 12px; }
        .full-params-section.expanded { display: block; }
        .full-params-note { background: rgba(185,121,62,0.08); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 11px; color: var(--muted); margin-bottom: 10px; }
        .official-link { display: inline-flex; align-items: center; gap: 5px; background: rgba(31,111,120,0.1); color: var(--accent); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; text-decoration: none; transition: all 0.15s; }
        .official-link:hover { background: var(--accent); color: #fff; }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; height: auto; max-height: 200px; } .cards { grid-template-columns: 1fr; } .search-bar { flex-direction: column; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Python 数据处理</h1>
            <p>离线速查工具 v3.0</p>
        </div>
        <nav class="nav-list" id="navList"></nav>
        <div class="stats" id="stats"></div>
        <div style="padding: 12px 16px; border-top: 1px solid var(--line);">
            <p style="font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 600;">官方文档</p>
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <a href="https://pandas.pydata.org/docs/reference/index.html" target="_blank" class="official-link" style="font-size: 11px;">📖 pandas 官方文档</a>
                <a href="https://numpy.org/doc/stable/reference/index.html" target="_blank" class="official-link" style="font-size: 11px;">📖 NumPy 官方文档</a>
                <a href="https://docs.scipy.org/doc/scipy/reference/index.html" target="_blank" class="official-link" style="font-size: 11px;">📖 SciPy 官方文档</a>
                <a href="https://seaborn.pydata.org/api.html" target="_blank" class="official-link" style="font-size: 11px;">📖 seaborn 官方文档</a>
                <a href="https://matplotlib.org/stable/api/index.html" target="_blank" class="official-link" style="font-size: 11px;">📖 matplotlib 官方文档</a>
            </div>
        </div>
    </aside>
    <main class="main">
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索函数名或描述...">
            <button class="clear-btn" onclick="clearSearch()">清空</button>
        </div>
        <div class="category-bar" id="categoryBar"></div>
        <div class="content" id="content">
            <div class="cards" id="cards"></div>
        </div>
    </main>

<script>
const commands = {"pandas":[{"name":"read_csv","desc":"读取CSV文件到DataFrame","syntax":"pd.read_csv(filepath, sep=',', encoding='utf-8', header=0, index_col=None, usecols=None, dtype=None, nrows=None, na_values=None)","lib":"pandas","docUrl":"https://pandas.pydata.org/docs/reference/api/pandas.read_csv.html","params":{"filepath":{"name":"filepath","meaning":"文件路径、URL或文件对象","detail":"支持本地文件路径、http/ftp URL、或者实现了 __len__ 和 read 方法的文件对象","type":"str","default":null,"required":true},"sep":{"name":"sep","meaning":"字段分隔符","detail":"CSV 文件常用逗号分隔，tsv 文件用制表符 \\t。传入正则表达式可匹配多个分隔符","type":"str","default":",","required":false},"encoding":{"name":"encoding","meaning":"字符编码格式","detail":"中文数据常用 utf-8、gbk 或 gbk2312。遇到乱码时要检查此项，encoding_errors 参数可控制错误处理方式","type":"str","default":"utf-8","required":false},"header":{"name":"header","meaning":"行号用作列名","detail":"默认 0 即第一行作为列名；设为 None 则把数据当列名；传入整数列表可指定多层列名","type":"int","default":"0","required":false},"index_col":{"name":"index_col","meaning":"用作索引的列号或列名","detail":"可以传列索引（0起始）或列名字符串，设为 False 表示不把任何列当索引。多层索引可传列表","type":"int, str, list","default":"None","required":false},"usecols":{"name":"usecols","meaning":"限制要读取的列","detail":"传入列索引列表、列名列表或可调用函数（函数接收列名返回 True/False）。支持高效裁列减少内存","type":"list, callable","default":"None","required":false},"dtype":{"name":"dtype","meaning":"列的数据类型","detail":"传入 {列名: dtype} 字典可指定每列类型，支持 pandas dtype 字符串或 numpy dtype 对象","type":"dict","default":"None","required":false},"nrows":{"name":"nrows","meaning":"要读取的行数","detail":"大文件可先读一小部分验证结构，常配合 skiprows 使用来读不同片段","type":"int","default":"None","required":false},"na_values":{"name":"na_values","meaning":"识别为 NA/NaN 的值","detail":"可以传字符串、字符串列表或 {列名: 列表} 字典。自定义缺失值标识比默认规则更精准","type":"str, list, dict","default":"None","required":false},"skiprows":{"name":"skiprows","meaning":"跳过开头的行","detail":"传入行号列表（0起始）或函数（函数接收行号返回 True 则跳过）。常用于跳过注释行或标题行","type":"int, list, callable","default":"None","required":false},"na_filter":{"name":"na_filter","meaning":"是否检测缺失值标记","detail":"关闭后不把常见缺失值标识（空字符串、NA、None 等）转成 NaN，可略微提升大文件读取速度","type":"bool","default":"True","required":false},"skipfooter":{"name":"skipfooter","meaning":"跳过末尾的行数","detail":"engine='python' 时可用，engine='c' 不支持。适合跳过文件末尾的汇总行","type":"int","default":"0","required":false},"parse_dates":{"name":"parse_dates","meaning":"尝试将某些列解析为日期","detail":"传 True 或列名列表，也可传 {列名: 格式字符串} 字典。解析失败会保持原字符串","type":"bool, list, dict","default":"False","required":false},"chunksize":{"name":"chunksize","meaning":"分块读取的行数","detail":"返回 TextFileReader 对象用于迭代读取大文件，配合 itertuples() 可高效处理 GB 级 CSV","type":"int","default":"None","required":false}},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf = pd.read_csv('data.csv', sep=';', encoding='latin1')\ndf = pd.read_csv('data.csv', usecols=['a', 'b'])\nprint(df.head())","category":"io","tips":["大文件优先裁列或抽样读入，先验证结构再上全量","先确认源文件编码、分隔符和日期列"],"visualType":"table","visualNote":"表格数据读写示意"},{"name":"read_excel","desc":"读取Excel文件(.xlsx, .xls)","syntax":"pd.read_excel(filepath, sheet_name=0, header=0, usecols=None, dtype=None)","params":{"filepath":"文件路径","sheet_name":"工作表名称或索引，默认0","header":"用作列名的行号，默认0","usecols":"要读取的列","dtype":"数据类型字典"},"example":"import pandas as pd\ndf = pd.read_excel('data.xlsx')\ndf = pd.read_excel('data.xlsx', sheet_name='Sales')\nprint(df.shape)","category":"io","tips":["多sheet文件里最好显式写出目标工作表"],"visualType":"table","visualNote":"Excel表格读取示意"},{"name":"read_json","desc":"读取JSON文件或字符串","syntax":"pd.read_json(json_string, orient=None, typ='frame')","params":{"orient":"JSON格式: 'split', 'records', 'index', 'columns', 'values'","typ":"返回类型: 'frame'或'series'"},"example":"import pandas as pd\ndf = pd.read_json('data.json', orient='records')\nprint(df.head())","category":"io","visualType":"table","visualNote":"JSON数据读取示意"},{"name":"head","desc":"返回前n行数据","syntax":"df.head(n=5)","params":{"n":"行数，默认5"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.head(10)  # 前10行\ndf.head()   # 前5行","category":"inspect","tips":["先看样本、类型和缺失比例"],"visualType":"table","visualNote":"数据预览示意"},{"name":"tail","desc":"返回后n行数据","syntax":"df.tail(n=5)","params":{"n":"行数，默认5"},"example":"df.tail(10)  # 后10行\ndf.tail()   # 后5行","category":"inspect","visualType":"table","visualNote":"数据末尾预览"},{"name":"info","desc":"显示DataFrame的详细信息","syntax":"df.info(verbose=None, buf=None, max_cols=None, memory_usage=None)","params":{"verbose":"是否显示完整信息","max_cols":"最大显示列数","memory_usage":"是否显示内存使用"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.info()\ndf.info(verbose=True, memory_usage='deep')","category":"inspect","tips":["先确认行数、列名和类型"],"visualType":"table","visualNote":"数据结构信息示意"},{"name":"describe","desc":"生成描述性统计信息","syntax":"df.describe(percentiles=None, include=None, exclude=None)","lib":"pandas","docUrl":"https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.describe.html","params":{"percentiles":{"name":"percentiles","meaning":"要输出的分位数","detail":"默认 [.25, .5, .75]，即四分位数。值须在 0-1 之间，按升序排列","type":"list","default":"[0.25, 0.5, 0.75]","required":false},"include":{"name":"include","meaning":"包含哪些数据类型","detail":"'all' 包含所有类型，'number' 只数值，'object' 只字符串，'datetime' 只时间。可传类型列表","type":"str, list","default":"None","required":false},"exclude":{"name":"exclude","meaning":"排除哪些数据类型","detail":"与 include 互斥，可传类型字符串如 'number' 或 'object'","type":"str, list","default":"None","required":false},"datetime_is_numeric":{"name":"datetime_is_numeric","meaning":"是否把 datetime 列当数值处理","detail":"True 时 datetime 列会输出 count, mean, std 等统计，False 时只输出 count 和 unique","type":"bool","default":"False","required":false}},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.describe()\ndf.describe(percentiles=[.1, .5, .9])\ndf.describe(include='all')","category":"inspect","visualType":"distribution","visualNote":"描述性统计分布示意"},{"name":"isna","desc":"检测缺失值，返回布尔DataFrame","syntax":"df.isna()\ndf.isnull()","example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.isna()  # 返回布尔DataFrame\ndf.isnull().sum()  # 每列缺失值数量\ndf[df['col'].isna()]  # 筛选有缺失值的行","category":"clean","visualType":"heatmap","visualNote":"缺失值热力图示意"},{"name":"fillna","desc":"填充缺失值","syntax":"df.fillna(value=None, method=None, axis=None, inplace=False)","lib":"pandas","docUrl":"https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.fillna.html","params":{"value":{"name":"value","meaning":"用于填充缺失值的数据","detail":"可传标量、字典、Series、DataFrame。字典可按列指定不同填充值。None（默认）会创建 NA","type":"scalar, dict, Series, DataFrame","default":"None","required":false},"method":{"name":"method","meaning":"填充方法","detail":"'ffill'（或'pad'）前向填充，用前面的值填；'bfill'（或'backfill'）后向填充，用后面的值填。method 和 value 不能同时用","type":"str","default":"None","required":false},"axis":{"name":"axis","meaning":"沿哪个轴填充","detail":"0（或'index'）按列方向填充，每列独立向前/后找值；1（或'columns'）按行方向填充","type":"int, str","default":"None","required":false},"inplace":{"name":"inplace","meaning":"是否原地修改","detail":"True 时直接修改原 DataFrame，不返回新对象，节省内存","type":"bool","default":"False","required":false},"limit":{"name":"limit","meaning":"连续填充的最大次数","detail":"配合 method 使用，限制最多填充多少个连续 NA。超过限制的保持 NA","type":"int","default":"None","required":false},"downcast":{"name":"downcast","meaning":"是否向下转换数据类型","detail":"'infer' 时尝试将填充后的列降为最小适用类型（如 float64→int64）。可节省内存","type":"str, dict","default":"None","required":false}},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.fillna(0)\ndf.fillna(df.mean())\ndf.fillna({'col1': 0, 'col2': -1})\ndf['col'].fillna('unknown', inplace=True)","category":"clean","tips":["建议先明确业务规则，再决定是补值、删行还是改类型"],"visualType":"table","visualNote":"缺失值填充示意"},{"name":"dropna","desc":"删除包含缺失值的行或列","syntax":"df.dropna(axis=0, how='any', thresh=None, subset=None)","params":{"axis":"0删除行，1删除列","how":"'any'任一缺失删除，'all'全部缺失删除","thresh":"非缺失值数量阈值","subset":"在哪些列中查找缺失值"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.dropna()\ndf.dropna(axis=1)\ndf.dropna(thresh=3)\ndf.dropna(subset=['col1', 'col2'])","category":"clean","visualType":"table","visualNote":"删除缺失值行示意"},{"name":"drop_duplicates","desc":"删除重复行","syntax":"df.drop_duplicates(subset=None, keep='first', inplace=False)","params":{"subset":"判断重复的列","keep":"'first', 'last'保留哪个"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.drop_duplicates()\ndf.drop_duplicates(subset=['col'], keep='last')","category":"clean","tips":["去重前最好先排序，明确保留哪条记录"],"visualType":"table","visualNote":"删除重复行示意"},{"name":"merge","desc":"合并两个DataFrame（类似SQL JOIN）","syntax":"pd.merge(left, right, on=None, how='inner', left_on=None, right_on=None, suffixes=('_x', '_y'))","lib":"pandas","docUrl":"https://pandas.pydata.org/docs/reference/api/pandas.merge.html","params":{"on":{"name":"on","meaning":"连接的列名（必须存在于两个DataFrame）","detail":"传入列名字符串或列名列表（用于多层索引）。left_on 和 right_on 可替代此参数","type":"str, list","default":"None","required":false},"left_on":{"name":"left_on","meaning":"左边DataFrame的连接列","detail":"可传列名或列索引。与 on 参数互斥，不能同时使用","type":"str, int","default":"None","required":false},"right_on":{"name":"right_on","meaning":"右边DataFrame的连接列","detail":"可传列名或列索引。与 on 参数互斥","type":"str, int","default":"None","required":false},"how":{"name":"how","meaning":"连接类型","detail":"'left' 用左表为基准，'right' 用右表，'inner' 只保留两边都有的键，'outer' 保留所有键。cross 用于笛卡尔积","type":"str","default":"'inner'","required":false},"left_index":{"name":"left_index","meaning":"是否用左边DataFrame的索引连接","detail":"True 时把左边索引当连接键，需要索引有实际意义（如 DatetimeIndex）","type":"bool","default":"False","required":false},"right_index":{"name":"right_index","meaning":"是否用右边DataFrame的索引连接","detail":"True 时把右边索引当连接键，常配合 left_index 使用实现双索引连接","type":"bool","default":"False","required":false},"suffixes":{"name":"suffixes","meaning":"重复列名的后缀","detail":"当左右表有同名列但未作为连接键时，自动加后缀区分，如 ('_x', '_y')","type":"tuple","default":"('_x', '_y')","required":false},"copy":{"name":"copy","meaning":"是否复制合并后的DataFrame","detail":"设置为 False 可避免不必要的拷贝提升性能，但可能修改原DataFrame数据","type":"bool","default":"True","required":false},"indicator":{"name":"indicator","meaning":"是否添加合并来源列","detail":"True 时新增 _merge 列，值含 'left_only', 'right_only', 'both'，方便排查哪些行匹配失败","type":"bool","default":"False","required":false},"validate":{"name":"validate","meaning":"验证合并键的唯一性","detail":"'1:1' 验证两边键都唯一，'1:m' 验证左边唯一，'m:1' 验证右边唯一。不符合会抛异常","type":"str","default":"None","required":false}},"example":"import pandas as pd\ndf1 = pd.DataFrame({'a': [1,2], 'b': [3,4]})\ndf2 = pd.DataFrame({'a': [1,2], 'c': [5,6]})\npd.merge(df1, df2, on='a', how='left')\npd.merge(df1, df2, left_on='a', right_on='b')","category":"join","tips":["合并后优先检查记录数有没有意外放大"],"visualType":"table","visualNote":"表格连接示意"},{"name":"concat","desc":"拼接多个DataFrame","syntax":"pd.concat(objs, axis=0, join='outer', ignore_index=False)","lib":"pandas","docUrl":"https://pandas.pydata.org/docs/reference/api/pandas.concat.html","params":{"objs":{"name":"objs","meaning":"要拼接的DataFrame或Series列表","detail":"传入 DataFrame/Series 的列表或字典。字典时键会成为层次化索引的级别","type":"list, dict","default":"None","required":true},"axis":{"name":"axis","meaning":"拼接方向","detail":"0 或 'index'：纵向堆叠（行方向增加）；1 或 'columns'：横向拼接（列方向增加）","type":"int, str","default":"0","required":false},"join":{"name":"join","meaning":"索引对齐方式","detail":"'outer' 保留两个方向的所有索引（并集），'inner' 只保留共同的索引（交集）","type":"str","default":"'outer'","required":false},"ignore_index":{"name":"ignore_index","meaning":"是否忽略原索引","detail":"True 时不保留原始索引，生成新的 0~N-1 整数索引。False 时保留，可能产生重复索引警告","type":"bool","default":"False","required":false},"keys":{"name":"keys","meaning":"多层索引标识来源","detail":"传入列表为结果增加一层由这些标识组成的索引，方便追溯每块数据来源","type":"list","default":"None","required":false},"levels":{"name":"levels","meaning":"多层索引的层级顺序","detail":"配合 keys 使用，指定 MultiIndex 的层级顺序。不常用","type":"list","default":"None","required":false},"verify_integrity":{"name":"verify_integrity","meaning":"是否检查索引是否重复","detail":"True 时如果拼接后索引有重复会抛异常。关闭检查可提升速度，但可能导致意外结果","type":"bool","default":"False","required":false},"sort":{"name":"sort","meaning":"是否对非连接列排序","detail":"当 axis=1 时，是否对列名字符串排序。关闭排序可能保留原始列顺序","type":"bool","default":"None","required":false}},"example":"import pandas as pd\ndf1 = pd.DataFrame({'a': [1,2]})\ndf2 = pd.DataFrame({'a': [3,4]})\npd.concat([df1, df2])\npd.concat([df1, df2], axis=1)\npd.concat([df1, df2], ignore_index=True)","category":"join","visualType":"table","visualNote":"表格拼接示意"},{"name":"groupby","desc":"按一或多列分组","syntax":"df.groupby(by=None, axis=0, level=None, as_index=True, sort=True)","lib":"pandas","docUrl":"https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.groupby.html","params":{"by":{"name":"by","meaning":"分组依据的列名、列名列表或函数","detail":"传列名字符串或列表、传函数（如 lambda x: x.year）会作用于索引、传 Series 或字典会按值映射分组","type":"str, list, Series, dict, function","default":"None","required":false},"axis":{"name":"axis","meaning":"沿哪个轴分组","detail":"0 按行索引方向分组（默认），1 按列方向分组（不建议，易混淆）","type":"int","default":"0","required":false},"level":{"name":"level","meaning":"按多层索引的哪个层级分组","detail":"当索引是 MultiIndex 时可用。传整数（0起始）或层级名字符串","type":"int, str","default":"None","required":false},"as_index":{"name":"as_index","meaning":"分组键是否作为返回结果的索引","detail":"True 时分组键作为索引便于后续操作，False 时分组键作为列。SQL 风格建议 False","type":"bool","default":"True","required":false},"sort":{"name":"sort","meaning":"是否对分组键排序","detail":"关闭排序可提升大数据集合并性能，但结果中组键不再保证有序","type":"bool","default":"True","required":false},"dropna":{"name":"dropna","meaning":"是否排除NA分组键","detail":"True 时把含 NA 的组整个丢弃，False 时 NA 会自成一组（NaN 组）","type":"bool","default":"True","required":false}},"example":"import pandas as pd\ndf = pd.DataFrame({'a': ['x','x','y','y'], 'b': [1,2,3,4]})\ndf.groupby('a').mean()\ndf.groupby('a', as_index=False).agg({'b': 'sum'})\ndf.groupby(['a', 'b']).size()","category":"group","tips":["分组前先确认键是否有脏值或意外空值"],"visualType":"bar","visualNote":"分组聚合柱状图示意"},{"name":"pivot_table","desc":"创建透视表","syntax":"df.pivot_table(values=None, index=None, columns=None, aggfunc='mean', fill_value=None, margins=False)","lib":"pandas","docUrl":"https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.pivot_table.html","params":{"values":{"name":"values","meaning":"要聚合的数值列","detail":"不指定时默认所有数值列都会被聚合。多值时生成多层级列","type":"str, list","default":"None","required":false},"index":{"name":"index","meaning":"行索引（分组键）","detail":"可传列名、列名列表或函数。类似于 SQL 的 GROUP BY 的第一层分组维度","type":"str, list","default":"None","required":false},"columns":{"name":"columns","meaning":"列索引（次级分组）","detail":"传列名创建列方向的多级索引，生成更宽的透视表。columns 和 index 组合决定分组粒度","type":"str, list","default":"None","required":false},"aggfunc":{"name":"aggfunc","meaning":"聚合函数","detail":"默认 'mean'。可传单个函数（np.sum）、字符串（'sum', 'count'）或 {列名: 函数} 字典实现不同列不同聚合","type":"str, function, dict","default":"'mean'","required":false},"fill_value":{"name":"fill_value","meaning":"缺失值填充","detail":"聚合后产生的 NA 会被替换为指定值。不是所有 NA 都会被填充，只填充因为聚合产生的","type":"scalar","default":"None","required":false},"margins":{"name":"margins","meaning":"是否添加行列汇总","detail":"True 时在最右列添加 'All' 汇总行，最下行添加 'All' 汇总列，使用当前 aggfunc 聚合","type":"bool","default":"False","required":false},"dropna":{"name":"dropna","meaning":"是否删除全为 NA 的列","detail":"True 时不保留全为 NA 的列，False 时保留（列名会是 All）","type":"bool","default":"True","required":false},"margins_name":{"name":"margins_name","meaning":"汇总列/行的名称","detail":"默认 'All'，可自定义如 'Total'","type":"str","default":"'All'","required":false},"observed":{"name":"observed","meaning":"是否只显示观测到的分组","detail":"True 时只显示实际出现在数据中的分组值（cat 数据类型时有效），False 显示所有可能的分类值","type":"bool","default":"False","required":false}},"example":"import pandas as pd\ndf = pd.DataFrame({'product': ['A','B','A','B'], 'region': ['N','N','S','S'], 'sales': [100,200,150,250]})\ndf.pivot_table(values='sales', index='product', columns='region', aggfunc='sum')\ndf.pivot_table(index='product', columns='region', values='sales', aggfunc='mean', margins=True)","category":"reshape","tips":["透视、堆叠和展开很依赖唯一键"],"visualType":"heatmap","visualNote":"透视表热力图示意"},{"name":"melt","desc":"将宽格式转为长格式","syntax":"pd.melt(df, id_vars=None, value_vars=None, var_name=None, value_name='value')","params":{"id_vars":"保持不变的列","value_vars":"要转换为值的列","var_name":"变量列名","value_name":"值列名"},"example":"import pandas as pd\ndf = pd.DataFrame({'id': [1,2], 'x': [10,20], 'y': [30,40]})\npd.melt(df, id_vars=['id'], value_vars=['x','y'], var_name='var', value_name='val')","category":"reshape","tips":["seaborn很多图更喜欢长表结构"],"visualType":"table","visualNote":"宽转长格式示意"},{"name":"pivot","desc":"将长格式转为宽格式","syntax":"df.pivot(index=None, columns=None, values=None)","example":"import pandas as pd\ndf = pd.DataFrame({'date': ['2024-01','2024-01','2024-02','2024-02'], 'product': ['A','B','A','B'], 'sales': [100,200,150,250]})\ndf.pivot(index='date', columns='product', values='sales')","category":"reshape","visualType":"table","visualNote":"长转宽格式示意"},{"name":"loc","desc":"基于标签选择数据","syntax":"df.loc[row_selector, col_selector]","lib":"pandas","docUrl":"https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.loc.html","params":{"row_selector":{"name":"row_selector","meaning":"行选择器","detail":"可传单个标签（整数或字符串）、标签列表、切片对象、布尔数组、或可返回布尔数组的函数","type":"label, list, slice, bool array","default":"None","required":false},"col_selector":{"name":"col_selector","meaning":"列选择器","detail":"可传单个列名、列名列表、切片（切片边界是列名字符串）。与 row_selector 维度对应","type":"label, list, slice","default":"None","required":false}},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.loc[0:5, 'col1':'col3']  # 切片选择\ndf.loc[df['col'] > 0]      # 布尔筛选\ndf.loc[:, 'col'] = value   # 按标签赋值","category":"filter","visualType":"table","visualNote":"标签选择数据示意"},{"name":"iloc","desc":"基于整数位置选择数据","syntax":"df.iloc[row_positions, col_positions]","example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.iloc[0:5, 0:3]       # 位置切片\ndf.iloc[:, [0, 2, 4]]     # 位置列表\ndf.iloc[0]                # 第一行","category":"filter","visualType":"table","visualNote":"位置选择数据示意"},{"name":"query","desc":"使用字符串表达式查询","syntax":"df.query(expr, inplace=False, engine=None)","params":{"expr":"布尔表达式字符串","engine":"'python'或'numexpr'"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.query('col > 10')\ndf.query('col1 == \"A\" & col2 < 5')\ndf.query('col in [\"a\", \"b\"]')\nthreshold = 500\ndf.query('sales >= @threshold')","category":"filter","tips":["复杂筛选最好先做中间变量，便于抽样核对结果"],"visualType":"table","visualNote":"表达式查询示意"},{"name":"sort_values","desc":"按值排序","syntax":"df.sort_values(by, axis=0, ascending=True, na_position='last', inplace=False)","params":{"by":"排序列名或列名列表","ascending":"升序或降序","na_position":"'first'或'last'缺失值位置"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.sort_values('col')\ndf.sort_values(['col1', 'col2'], ascending=[True, False])\ndf.sort_values('col', ascending=False)","category":"filter","visualType":"bar","visualNote":"排序柱状图示意"},{"name":"astype","desc":"转换数据类型","syntax":"df.astype(dtype, copy=True, errors='raise')","lib":"pandas","docUrl":"https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.astype.html","params":{"dtype":{"name":"dtype","meaning":"目标数据类型","detail":"可传单个类型（'int64', 'float32' 等）或 {列名: 类型} 字典按列指定。类型可以是 numpy 或 pandas 类型","type":"dtype, dict","default":"None","required":true},"copy":{"name":"copy","meaning":"是否复制数据","detail":"True 时返回新的 DataFrame，False 时尽量原地修改但可能不生效（取决于底层数组是否可写）","type":"bool","default":"True","required":false},"errors":{"name":"errors","meaning":"转换失败时的行为","detail":"'raise' 失败时抛异常，'ignore' 保持原列不变不抛异常。不推荐用 ignore，可能导致意外结果","type":"str","default":"'raise'","required":false}},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf['col'] = df['col'].astype(int)\ndf = df.astype({'col1': float, 'col2': int})\ndf.astype('float32')","category":"transform","tips":["对数值精度、内存占用和后续运算结果都有直接影响"],"visualType":"table","visualNote":"类型转换示意"},{"name":"apply","desc":"对每行或每列应用函数","syntax":"df.apply(func, axis=0, raw=False, result_type=None, args=())","params":{"axis":"0按列，1按行","raw":"传递Series还是数组","result_type":"'expand', 'reduce', 'broadcast'"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf['col'].apply(lambda x: x*2)\ndf.apply(lambda row: row['a'] + row['b'], axis=1)\ndf.apply(np.sum, axis=0)","category":"transform","tips":["规则简单时优先 map / where，复杂逻辑再考虑 apply"],"visualType":"table","visualNote":"函数应用示意"},{"name":"map","desc":"对Series元素应用映射","syntax":"Series.map(arg, na_action=None)","params":{"arg":"dict, Series或函数","na_action":"'ignore'跳过NA值"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf['col'].map({'a': 1, 'b': 2})\ndf['col'].map(lambda x: x.strip())\ndf['col'].map('count')","category":"transform","visualType":"table","visualNote":"映射转换示意"},{"name":"assign","desc":"添加新列（链式调用）","syntax":"df.assign(**kwargs)","example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.assign(new_col=df['a'] + df['b'])\ndf.assign(col1=lambda x: x['a'] * 2)","category":"transform","tips":["字段衍生适合和 assign、map 这类可读性高的写法配合使用"],"visualType":"table","visualNote":"新增列示意"},{"name":"value_counts","desc":"统计各值出现的频率","syntax":"Series.value_counts(normalize=False, sort=True, ascending=False, bins=None)","params":{"normalize":"返回频率而非计数","sort":"是否按频率排序","ascending":"升序排列","bins":"分箱数量"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf['col'].value_counts()\ndf['col'].value_counts(normalize=True)\ndf['col'].value_counts(bins=5)","category":"inspect","visualType":"bar","visualNote":"频率统计柱状图示意"},{"name":"to_datetime","desc":"将字符串转换为日期时间","syntax":"pd.to_datetime(arg, format=None, errors='coerce')","params":{"format":"日期字符串的解析格式","errors":"'raise', 'coerce', 'ignore'"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf['date'] = pd.to_datetime(df['date'])\ndf['date'] = pd.to_datetime(df['date'], format='%Y/%m/%d %H:%M', errors='coerce')","category":"time","tips":["时间处理前先转datetime并排序"],"visualType":"line","visualNote":"时间序列转换示意"},{"name":"resample","desc":"时间序列重采样","syntax":"df.resample(rule, axis=0, closed=None, label=None)","params":{"rule":"重采样频率规则，如'D', 'W', 'M'","axis":"重采样轴","closed":"区间左闭还是右闭","label":"标签落在区间左端还是右端"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf['date'] = pd.to_datetime(df['date'])\ndf.set_index('date').resample('M')['sales'].sum()\ndf.resample('W', on='date')['sales'].mean()","category":"time","visualType":"line","visualNote":"时间重采样示意"},{"name":"shift","desc":"移动数据（创建滞后或领先）","syntax":"df.shift(periods=1, freq=None, axis=0)","params":{"periods":"移动期数，正为滞后，负为领先"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf['prev'] = df['sales'].shift(1)   # 滞后\ndf['next'] = df['sales'].shift(-1)  # 领先\ndf['change'] = df['sales'] - df['sales'].shift(1)","category":"time","visualType":"line","visualNote":"时间位移示意"},{"name":"rolling","desc":"滚动窗口计算","syntax":"df.rolling(window=10, min_periods=None, center=False)","params":{"window":"滚动窗口大小","min_periods":"窗口内至少需要的有效值数量","center":"是否把窗口标签放在中间"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf['ma5'] = df['sales'].rolling(window=5, min_periods=1).mean()\ndf['ma10'] = df['sales'].rolling(window=10).std()","category":"time","visualType":"line","visualNote":"滚动窗口均值示意"},{"name":"corr","desc":"计算列之间的相关系数","syntax":"df.corr(method='pearson', min_periods=1)","params":{"method":"'pearson', 'kendall', 'spearman'","min_periods":"最小样本数"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.corr()\ndf[['col1', 'col2']].corr()\ndf.corr(method='spearman')","category":"inspect","visualType":"heatmap","visualNote":"相关性热力图示意"},{"name":"to_csv","desc":"保存为CSV文件","syntax":"df.to_csv(filepath, sep=',', index=False, encoding='utf-8')","params":{"filepath":"文件路径","sep":"分隔符","index":"是否写入索引","encoding":"编码格式"},"example":"import pandas as pd\ndf = pd.read_csv('data.csv')\ndf.to_csv('output.csv')\ndf.to_csv('output.csv', index=False, sep=';')","category":"io","visualType":"table","visualNote":"CSV保存示意"}],"numpy":[{"name":"array","desc":"创建NumPy数组","syntax":"np.array(object, dtype=None, copy=True)","lib":"numpy","docUrl":"https://numpy.org/doc/stable/reference/generated/numpy.array.html","params":{"object":{"name":"object","meaning":"输入数据","detail":"接受列表、元组、其他数组或任何可以转换为数组的序列。嵌套列表会创建多维数组","type":"array_like","default":"None","required":true},"dtype":{"name":"dtype","meaning":"目标数据类型","detail":"指定数组的数据类型，如 'float32', 'int64', 'complex128'。省略时自动从输入数据推断","type":"dtype","default":"None","required":false},"copy":{"name":"copy","meaning":"是否复制数据","detail":"True 总是复制，False 只有在必需时才复制（如类型不匹配或非 ndarray 输入）。注意：设为 False 不保证不复制","type":"bool","default":"True","required":false},"order":{"name":"order","meaning":"内存布局顺序","detail":"'C' 行优先（C style），'F' 列优先（Fortran style），'A' 自动选择，None 跟随输入。影响多维数组在内存中的存储方式","type":"str","default":"'K'","required":false},"ndmin":{"name":"ndmin","meaning":"最小维度","detail":"指定结果数组的最小维度。例如 ndmin=2 确保结果是二维数组，即使输入是一维数据","type":"int","default":"0","required":false}},"example":"import numpy as np\narr = np.array([1, 2, 3, 4, 5])\narr = np.array([[1, 2], [3, 4]])\nnp.array([1, 2, 3], dtype=float)","category":"numeric","tips":["先确认数组形状和dtype"],"visualType":"table","visualNote":"数组创建示意"},{"name":"zeros","desc":"创建全零数组","syntax":"np.zeros(shape, dtype=float, order='C')","params":{"shape":"数组形状，如(3,4)或5","dtype":"数据类型","order":"'C'行优先，'F'列优先"},"example":"import numpy as np\nnp.zeros(5)           # 一维\nnp.zeros((3, 4))      # 二维\nnp.zeros((2, 3, 4))   # 三维","category":"numeric","visualType":"table","visualNote":"全零数组示意"},{"name":"ones","desc":"创建全一数组","syntax":"np.ones(shape, dtype=float, order='C')","example":"import numpy as np\nnp.ones(5)\nnp.ones((3, 4))","category":"numeric","visualType":"table","visualNote":"全一数组示意"},{"name":"arange","desc":"创建数值序列数组","syntax":"np.arange(start, stop, step, dtype=None)","example":"import numpy as np\nnp.arange(0, 10, 2)   # [0, 2, 4, 6, 8]\nnp.arange(10)         # [0, 1, 2, ..., 9]\nnp.arange(1, 2, 0.1)","category":"numeric","visualType":"line","visualNote":"数值序列示意"},{"name":"linspace","desc":"创建等间隔数值数组","syntax":"np.linspace(start, stop, num=50, endpoint=True)","lib":"numpy","docUrl":"https://numpy.org/doc/stable/reference/generated/numpy.linspace.html","params":{"start":{"name":"start","meaning":"起始值","detail":"序列的起始值。可以是标量或数组（如果是数组，会在每个点之间插值）","type":"scalar, array_like","default":"None","required":true},"stop":{"name":"stop","meaning":"结束值","detail":"序列的结束值。配合 num 决定区间范围","type":"scalar, array_like","default":"None","required":true},"num":{"name":"num","meaning":"样本数量","detail":"生成样本的个数。默认 50。必须是非负整数。设为 0 返回空数组","type":"int","default":"50","required":false},"endpoint":{"name":"endpoint","meaning":"是否包含 stop","detail":"True 时 stop 是最后一个样本，False 时 stop 不包含（步长基于 num-1）","type":"bool","default":"True","required":false},"retstep":{"name":"retstep","meaning":"是否返回步长","detail":"True 时返回 (samples, step)，其中 step 是样本间的间距。用于诊断","type":"bool","default":"False","required":false},"dtype":{"name":"dtype","meaning":"输出数组数据类型","detail":"指定输出数组的类型。如果未指定，从 start/stop 类型推断，可能不是整数类型","type":"dtype","default":"None","required":false},"axis":{"name":"axis","meaning":"结果沿着哪个轴插入","detail":"当 start/stop 是数组时，指定沿着哪个轴插入生成的样本","type":"int","default":"0","required":false}},"example":"import numpy as np\nnp.linspace(0, 1, 10)\nnp.linspace(0, 10, 5)","category":"numeric","visualType":"line","visualNote":"等间隔数组示意"},{"name":"reshape","desc":"改变数组形状","syntax":"arr.reshape(new_shape, order='C')","lib":"numpy","docUrl":"https://numpy.org/doc/stable/reference/generated/numpy.reshape.html","params":{"new_shape":{"name":"new_shape","meaning":"目标形状","detail":"可以是整数元组或形状元组。一维维度可写 -1，程序会自动计算该维度大小。必须保证新形状总元素数与原数组一致","type":"int, tuple","default":"None","required":true},"order":{"name":"order","meaning":"元素读取/存储顺序","detail":"'C' 按行优先（最后一维变化最快），'F' 按列优先（第一维变化最快），'A' 跟随原数组。影响数据在内存中的重排方式","type":"str","default":"'C'","required":false}},"example":"import numpy as np\narr = np.arange(12)\narr.reshape(2, 3)\nnp.reshape(arr, (3, 4))","category":"numeric","tips":["改形状前要确认元素总数保持一致"],"visualType":"grid","visualNote":"数组形状改变示意"},{"name":"concatenate","desc":"拼接数组","syntax":"np.concatenate((a1, a2, ...), axis=0)","params":{"axis":"拼接轴，0纵向，1横向"},"example":"import numpy as np\na1 = np.array([1, 2, 3])\na2 = np.array([4, 5, 6])\nnp.concatenate([a1, a2])\nnp.concatenate([a1.reshape(2,2), a2.reshape(2,2)], axis=1)","category":"numeric","visualType":"table","visualNote":"数组拼接示意"},{"name":"where","desc":"条件查找或替换","syntax":"np.where(condition, x, y)","example":"import numpy as np\narr = np.array([1, 2, 3, 4, 5])\nnp.where(arr > 2, arr, 0)          # 替换\nnp.where(arr > 2)                  # 返回索引","category":"numeric","tips":["条件应返回与原对象对齐的布尔结果"],"visualType":"scatter","visualNote":"条件替换示意"},{"name":"mean","desc":"计算平均值","syntax":"np.mean(a, axis=None, dtype=None)","example":"import numpy as np\narr = np.array([1, 2, 3, 4, 5])\nnp.mean(arr)\nnp.mean(arr, axis=0)","category":"numeric","visualType":"bar","visualNote":"均值计算示意"},{"name":"std","desc":"计算标准差","syntax":"np.std(a, axis=None, dtype=None, ddof=0)","params":{"ddof":"自由度，ddof=1为样本标准差"},"example":"import numpy as np\narr = np.array([1, 2, 3, 4, 5])\nnp.std(arr)\nnp.std(arr, ddof=1)","category":"numeric","visualType":"distribution","visualNote":"标准差示意"},{"name":"sum","desc":"计算总和","syntax":"np.sum(a, axis=None, dtype=None)","example":"import numpy as np\narr = np.array([1, 2, 3, 4, 5])\nnp.sum(arr)","category":"numeric","visualType":"bar","visualNote":"求和示意"},{"name":"min","desc":"找最小值","syntax":"np.min(a, axis=None)","example":"import numpy as np\narr = np.array([3, 1, 4, 1, 5])\nnp.min(arr)\nnp.argmin(arr)","category":"numeric","visualType":"scatter","visualNote":"最小值示意"},{"name":"max","desc":"找最大值","syntax":"np.max(a, axis=None)","example":"import numpy as np\narr = np.array([3, 1, 4, 1, 5])\nnp.max(arr)\nnp.argmax(arr)","category":"numeric","visualType":"scatter","visualNote":"最大值示意"},{"name":"dot","desc":"矩阵点积","syntax":"np.dot(a, b, out=None)","example":"import numpy as np\na = np.array([1, 2])\nb = np.array([3, 4])\nnp.dot(a, b)  # 1*3 + 2*4 = 11","category":"numeric","visualType":"scatter","visualNote":"点积运算示意"},{"name":"matmul","desc":"矩阵乘法","syntax":"np.matmul(a, b, out=None)","example":"import numpy as np\na = np.array([[1, 2], [3, 4]])\nb = np.array([[5, 6], [7, 8]])\nnp.matmul(a, b)\na @ b  # Python 3.5+","category":"numeric","visualType":"grid","visualNote":"矩阵乘法示意"},{"name":"transpose","desc":"转置数组","syntax":"arr.T\narr.transpose()\nnp.transpose(arr, axes=None)","example":"import numpy as np\narr = np.array([[1, 2], [3, 4]])\narr.T\narr.transpose((1, 0))","category":"numeric","visualType":"grid","visualNote":"数组转置示意"},{"name":"random.rand","desc":"生成0-1随机数","syntax":"np.random.rand(d0, d1, ...)","example":"import numpy as np\nnp.random.rand(3, 4)   # 3x4随机数\nnp.random.rand(10)","category":"numeric","visualType":"scatter","visualNote":"随机数生成示意"},{"name":"random.randn","desc":"生成标准正态分布随机数","syntax":"np.random.randn(d0, d1, ...)","example":"import numpy as np\nnp.random.randn(3, 4)\nnp.random.randn(100)","category":"numeric","visualType":"distribution","visualNote":"正态分布随机数示意"},{"name":"random.randint","desc":"生成随机整数","syntax":"np.random.randint(low, high=None, size=None)","example":"import numpy as np\nnp.random.randint(0, 10)       # 0-9随机整数\nnp.random.randint(0, 10, (3, 4))","category":"numeric","visualType":"scatter","visualNote":"随机整数示意"},{"name":"random.seed","desc":"设置随机种子","syntax":"np.random.seed(seed)","example":"import numpy as np\nnp.random.seed(42)\nnp.random.rand(5)  # 每次运行结果相同","category":"numeric","visualType":"scatter","visualNote":"随机种子示意"},{"name":"unique","desc":"找唯一值","syntax":"np.unique(ar, return_index=False, return_inverse=False, return_counts=False)","example":"import numpy as np\narr = np.array([1, 2, 2, 3, 3, 3])\nnp.unique(arr)\nnp.unique(arr, return_counts=True)","category":"numeric","visualType":"bar","visualNote":"唯一值统计示意"},{"name":"sort","desc":"数组排序","syntax":"np.sort(a, axis=-1, kind=None)","params":{"axis":"排序轴，-1为最后一轴","kind":"'quicksort', 'mergesort', 'heapsort'"},"example":"import numpy as np\narr = np.array([3, 1, 4, 1, 5])\nnp.sort(arr)\nnp.argsort(arr)  # 返回索引","category":"numeric","visualType":"bar","visualNote":"排序示意"},{"name":"linalg.inv","desc":"计算逆矩阵","syntax":"np.linalg.inv(a)","example":"import numpy as np\nmatrix = np.array([[1, 2], [3, 4]])\nnp.linalg.inv(matrix)","category":"numeric","visualType":"grid","visualNote":"逆矩阵计算示意"},{"name":"linalg.solve","desc":"解线性方程组","syntax":"np.linalg.solve(a, b)","example":"import numpy as np\nA = np.array([[2, 1], [1, 3]])\nb = np.array([4, 5])\nx = np.linalg.solve(A, b)  # Ax = b","category":"numeric","visualType":"scatter","visualNote":"线性方程求解示意"},{"name":"linalg.eig","desc":"计算特征值和特征向量","syntax":"np.linalg.eig(a)","example":"import numpy as np\nmatrix = np.array([[1, 2], [2, 1]])\neigenvalues, eigenvectors = np.linalg.eig(matrix)","category":"numeric","visualType":"scatter","visualNote":"特征值分解示意"},{"name":"searchsorted","desc":"二分查找插入位置","syntax":"np.searchsorted(a, v, side='left')","example":"import numpy as np\nnp.searchsorted([1, 3, 5, 7], 4)  # 返回2","category":"numeric","visualType":"scatter","visualNote":"二分查找示意"}],"scipy":[{"name":"stats.zscore","desc":"标准化（Z-score）","syntax":"scipy.stats.zscore(a, axis=0, ddof=0)","lib":"scipy","docUrl":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.zscore.html","params":{"a":{"name":"a","meaning":"输入数组","detail":"要计算 Z-score 的数组。接受 array_like，每组样本应放 axis 指定的维度上","type":"array_like","default":"None","required":true},"axis":{"name":"axis","meaning":"沿哪个轴计算","detail":"0 则逐列计算（每个特征独立标准化），None 则把所有数据摊平成一维计算。默认 0","type":"int, None","default":"0","required":false},"ddof":{"name":"ddof","meaning":"自由度修正","detail":"计算标准差时的分母修正。ddof=0（默认）是总体标准差，ddof=1 是样本标准差。社会科学常用 ddof=1","type":"int","default":"0","required":false},"nan_policy":{"name":"nan_policy","meaning":"遇到 NA 时的策略","detail":"'propagate' 把 NA 往下传播，'raise' 抛异常，'omit' 忽略 NA 值计算","type":"str","default":"'propagate'","required":false}},"example":"import numpy as np\nfrom scipy import stats\n\nvalues = np.array([12, 14, 15, 16, 20, 25])\nresult = stats.zscore(values)\nprint(result)","category":"stats","tips":["先确认假设检验的前提条件"],"visualType":"distribution","visualNote":"Z-score标准化分布示意"},{"name":"stats.ttest_ind","desc":"独立样本t检验","syntax":"scipy.stats.ttest_ind(a, b, axis=0, equal_var=True)","lib":"scipy","docUrl":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.ttest_ind.html","params":{"a":{"name":"a","meaning":"第一组样本数据","detail":"第一个样本的数组，每行是一个观测值。沿 axis 排列的同一轴向是另一组的对应样本","type":"array_like","default":"None","required":true},"b":{"name":"b","meaning":"第二组样本数据","detail":"第二个样本的数组，形状应与 a 在 axis 指定的方向上兼容","type":"array_like","default":"None","required":true},"axis":{"name":"axis","meaning":"沿哪个轴进行检验","detail":"沿该轴计算，每轴独立执行一次 t 检验。默认 0（逐列比较两组）","type":"int, None","default":"0","required":false},"equal_var":{"name":"equal_var","meaning":"是否假设两组方差相等","detail":"True（默认）用 Welch t 检验（不假设方差相等，用 pooled variance 的修正）。False 时用 Welch-Aspin 检验，不假设方差相等","type":"bool","default":"True","required":false},"nan_policy":{"name":"nan_policy","meaning":"遇到 NA 时的策略","detail":"'propagate' 传播 NA，'raise' 抛异常，'omit' 忽略 NA 配对样本","type":"str","default":"'propagate'","required":false},"alternative":{"name":"alternative","meaning":"备择假设方向","detail":"'two-sided' 双侧检验，'less' 左侧检验(a<b)，'greater' 右侧检验(a>b)","type":"str","default":"'two-sided'","required":false}},"example":"import numpy as np\nfrom scipy import stats\n\ngroup_a = np.array([102, 98, 105, 110, 108])\ngroup_b = np.array([95, 97, 99, 100, 96])\nresult = stats.ttest_ind(group_a, group_b)\nprint(f\"statistic: {result.statistic:.4f}, pvalue: {result.pvalue:.4f})","category":"stats","tips":["检验前最好先检查样本量、异常值和分布形态"],"visualType":"bar","visualNote":"t检验两组对比示意"},{"name":"stats.ttest_rel","desc":"配对样本t检验","syntax":"scipy.stats.ttest_rel(a, b)","params":{"a":"第一组样本","b":"配对样本","alternative":"备择假设方向"},"example":"import numpy as np\nfrom scipy import stats\n\nbefore = np.array([78, 81, 75, 80, 77], dtype=float)\nafter = np.array([82, 83, 79, 84, 80], dtype=float)\nresult = stats.ttest_rel(before, after)\nprint(result)","category":"stats","tips":["配对样本里如果有缺失，最好先统一处理配对关系"],"visualType":"line","visualNote":"配对t检验示意"},{"name":"stats.pearsonr","desc":"Pearson相关系数检验","syntax":"scipy.stats.pearsonr(x, y)","lib":"scipy","docUrl":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.pearsonr.html","params":{"x":{"name":"x","meaning":"第一组样本（自变量）","detail":"第一个变量的一维数组，与 y 长度相同。计算两变量的线性相关性","type":"array_like","default":"None","required":true},"y":{"name":"y","meaning":"第二组样本（因变量）","detail":"第二个变量的一维数组，与 x 长度相同","type":"array_like","default":"None","required":true},"alternative":{"name":"alternative","meaning":"备择假设方向","detail":"'two-sided'（默认）检验是否相关，'less' 检验负相关，'greater' 检验正相关","type":"str","default":"'two-sided'","required":false},"method":{"name":"method","meaning":"用于计算 p 值的排列数","detail":"已废弃，现在忽略。p 值从 t 分布计算","type":"str","default":"None","required":false}},"example":"import numpy as np\nfrom scipy import stats\n\nx = np.array([1, 2, 3, 4, 5, 6])\ny = np.array([12, 14, 17, 18, 21, 24])\nr, p = stats.pearsonr(x, y)\nprint(f\"r: {r:.4f}, p: {p:.4f}\")","category":"stats","visualType":"scatter","visualNote":"Pearson相关性示意"},{"name":"stats.spearmanr","desc":"Spearman秩相关系数","syntax":"scipy.stats.spearmanr(a, b=None)","example":"import numpy as np\nfrom scipy import stats\n\nx = np.array([1, 2, 3, 4, 5])\ny = np.array([5, 4, 3, 2, 1])\nr, p = stats.spearmanr(x, y)\nprint(f\"rho: {r:.4f}, p: {p:.4f}\")","category":"stats","visualType":"scatter","visualNote":"Spearman相关性示意"},{"name":"stats.linregress","desc":"线性回归","syntax":"scipy.stats.linregress(x, y=None)","example":"import numpy as np\nfrom scipy import stats\n\nx = np.array([1, 2, 3, 4, 5])\ny = np.array([2.1, 4.2, 5.8, 8.1, 10.2])\nresult = stats.linregress(x, y)\nprint(f\"slope: {result.slope:.4f}, intercept: {result.intercept:.4f}\")","category":"stats","visualType":"scatter","visualNote":"线性回归拟合示意"},{"name":"stats.shapiro","desc":"Shapiro-Wilk正态性检验","syntax":"scipy.stats.shapiro(x)","example":"import numpy as np\nfrom scipy import stats\n\nvalues = np.array([8.1, 8.4, 8.8, 9.2, 9.3, 9.6, 10.1])\nstat, p = stats.shapiro(values)\nprint(f\"stat: {stat:.4f}, p: {p:.4f}\")","category":"stats","tips":["样本量不大时常用来做正态性检查，但对异常值较敏感"],"visualType":"distribution","visualNote":"正态性检验示意"},{"name":"stats.mannwhitneyu","desc":"Mann-Whitney U检验（非参数）","syntax":"scipy.stats.mannwhitneyu(a, b, alternative='two-sided')","example":"import numpy as np\nfrom scipy import stats\n\ngroup_a = np.array([102, 98, 105, 110, 108])\ngroup_b = np.array([95, 97, 99, 100, 96])\nresult = stats.mannwhitneyu(group_a, group_b)\nprint(result)","category":"stats","tips":["两组样本彼此独立，不要求满足正态分布"],"visualType":"box","visualNote":"Mann-Whitney U检验示意"},{"name":"stats.wilcoxon","desc":"Wilcoxon符号秩检验（配对）","syntax":"scipy.stats.wilcoxon(a, b=None)","example":"import numpy as np\nfrom scipy import stats\n\nbefore = np.array([78, 81, 75, 80, 77], dtype=float)\nafter = np.array([82, 83, 79, 84, 80], dtype=float)\nresult = stats.wilcoxon(before, after)\nprint(result)","category":"stats","visualType":"box","visualNote":"Wilcoxon符号秩检验示意"},{"name":"stats.f_oneway","desc":"单因素方差分析","syntax":"scipy.stats.f_oneway(*samples)","example":"import numpy as np\nfrom scipy import stats\n\ngroup_a = np.array([102, 98, 105, 110, 108])\ngroup_b = np.array([95, 97, 99, 100, 96])\ngroup_c = np.array([112, 115, 111, 118, 116])\nresult = stats.f_oneway(group_a, group_b, group_c)\nprint(result)","category":"stats","visualType":"bar","visualNote":"方差分析示意"},{"name":"stats.chi2","desc":"卡方检验","syntax":"scipy.stats.chi2_contingency(table)","example":"import numpy as np\nfrom scipy import stats\n\ntable = np.array([[42, 18], [28, 31]])\nresult = stats.chi2_contingency(table)\nprint(f\"chi2: {result[0]:.4f}, p: {result[1]:.4f}\")","category":"stats","visualType":"heatmap","visualNote":"卡方检验示意"},{"name":"stats.gaussian_kde","desc":"核密度估计","syntax":"scipy.stats.gaussian_kde(dataset)","params":{"dataset":"用于估计密度的数据集","bw_method":"核密度估计的带宽方法"},"example":"import numpy as np\nfrom scipy import stats\n\nvalues = np.array([12, 14, 15, 16, 18, 20, 21])\nkde = stats.gaussian_kde(values)\ngrid = np.linspace(values.min(), values.max(), 50)\ndensity = kde(grid)\nprint(density[:5])","category":"stats","visualType":"distribution","visualNote":"核密度估计示意"},{"name":"optimize.minimize","desc":"数值优化求解","syntax":"scipy.optimize.minimize(fun, x0, args=(), method='BFGS')","lib":"scipy","docUrl":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.optimize.minimize.html","params":{"fun":{"name":"fun","meaning":"目标函数","detail":"要最小化的函数，签名 fun(x, *args) -> float。x 是参数向量，args 是传入的其他固定参数。必须返回标量","type":"callable","default":"None","required":true},"x0":{"name":"x0","meaning":"初始参数猜测","detail":"参数向量的初始猜测，一维数组。形状应与 fun 期望一致。好的初始值能帮助收敛","type":"array_like","default":"None","required":true},"args":{"name":"args","meaning":"传递给目标函数的额外参数","detail":"元组形式，传递给 fun 的固定参数。例如 minimize(fun, x0, args=(data,))，fun 接收 (x, data)","type":"tuple","default":"()","required":false},"method":{"name":"method","meaning":"优化算法","detail":"'BFGS'（默认拟牛顿）、'Nelder-Mead'（下山单纯形）、'Powell'、'CG'、'Newton-CG'、'L-BFGS-B'（有约束）、'SLSQP'（有约束）等。选择取决于问题规模和约束","type":"str","default":"'BFGS'","required":false},"jac":{"name":"jac","meaning":"梯度信息","detail":"目标函数的梯度。传 True 让 minimize 数值估计梯度，或传可调用函数返回梯度向量。精确梯度能加速收敛","type":"callable, bool","default":"None","required":false},"hess":{"name":"hess","meaning":"海森矩阵（二阶梯度）","detail":"二阶导数矩阵。传可调用函数返回 (x, *args) -> Hessian 矩阵。牛顿类方法需要","type":"callable","default":"None","required":false},"hessp":{"name":"hessp","meaning":"海森矩阵与向量的乘积","detail":"对某些拟牛顿方法可传高效的 Hessian-向量乘积函数","type":"callable","default":"None","required":false},"bounds":{"name":"bounds","meaning":"变量边界约束","detail":"序列的 (min, max) 元组列表，限制每个变量的取值范围。仅限 L-BFGS-B、SLSQP、TNC","type":"sequence","default":"None","required":false},"constraints":{"name":"constraints","meaning":"约束条件","detail":"字典或字典列表，形式如 {'type': 'ineq', 'fun': lambda x: x[0]-x[1]}。支持等式('eq')和不等式('ineq')约束","type":"dict, list","default":"()","required":false},"tol":{"name":"tol","meaning":"收敛阈值","detail":"迭代终止的容差。通常不需要修改，过小会导致过多迭代，过大可能早停","type":"float","default":"None","required":false},"options":{"name":"options","meaning":"算法选项字典","detail":"如 {'maxiter': 1000, 'disp': True} 设置最大迭代次数和显示诊断信息","type":"dict","default":"None","required":false},"callback":{"name":"callback","meaning":"每步迭代的回调函数","detail":"在每次迭代后调用，签名 callback(xk)，可用于监控或提前终止","type":"callable","default":"None","required":false}},"example":"from scipy.optimize import minimize\n\ndef objective(x):\n    return (x[0] - 2)**2 + (x[1] + 1)**2\n\nresult = minimize(objective, x0=[0, 0])\nprint(f\"x: {result.x}, fun: {result.fun}\")","category":"optimize","tips":["目标函数需要返回标量"],"visualType":"scatter","visualNote":"优化求解示意"},{"name":"optimize.curve_fit","desc":"曲线拟合","syntax":"scipy.optimize.curve_fit(f, xdata, ydata, p0=None)","params":{"f":"待拟合的函数模型","xdata":"自变量观测值","ydata":"因变量观测值","p0":"初始参数猜测","bounds":"参数上下界"},"example":"import numpy as np\nfrom scipy.optimize import curve_fit\n\ndef model(x, a, b):\n    return a * np.exp(b * x)\n\nxdata = np.array([0, 1, 2, 3, 4], dtype=float)\nydata = np.array([2.0, 2.8, 4.1, 5.8, 8.2])\nparams, cov = curve_fit(model, xdata, ydata, p0=[1, 0.5])\nprint(f\"a: {params[0]:.4f}, b: {params[1]:.4f}\")","category":"optimize","visualType":"scatter","visualNote":"曲线拟合示意"},{"name":"optimize.root","desc":"求方程根","syntax":"scipy.optimize.root(fun, x0, args=())","example":"from scipy.optimize import root\n\ndef equation(x):\n    return x**3 - 2*x - 5\n\nresult = root(equation, x0=[2])\nprint(f\"root: {result.x[0]:.4f}\")","category":"optimize","visualType":"line","visualNote":"方程求根示意"},{"name":"signal.savgol_filter","desc":"Savitzky-Golay平滑滤波","syntax":"scipy.signal.savgol_filter(x, window_length, polyorder)","params":{"window_length":"平滑窗口长度（正奇数）","polyorder":"局部拟合多项式阶数","mode":"边界点处理方式"},"example":"import numpy as np\nfrom scipy.signal import savgol_filter\n\nseries = np.array([2.0, 2.2, 2.5, 2.9, 3.8, 3.2, 3.1, 3.3, 3.5])\nresult = savgol_filter(series, window_length=5, polyorder=2)\nprint(result.round(3))","category":"signal","tips":["窗口越大平滑越强，但也更可能抹掉细节"],"visualType":"line","visualNote":"Savitzky-Golay平滑示意"},{"name":"signal.find_peaks","desc":"峰值检测","syntax":"scipy.signal.find_peaks(x, height=None, distance=None, prominence=None)","lib":"scipy","docUrl":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.signal.find_peaks.html","params":{"x":{"name":"x","meaning":"一维信号数据","detail":"要搜索峰值的信号数组，沿一维方向查找局部最大值","type":"array_like","default":"None","required":true},"height":{"name":"height","meaning":"峰值最低高度门槛","detail":"可传标量（最小高度）或 (min, max) 元组。低于此阈值的点不可能是峰。可以是数组对每个峰值不同判断","type":"float, tuple, array_like","default":"None","required":false},"distance":{"name":"distance","meaning":"相邻峰之间的最小间距","detail":"相邻峰之间至少间隔多少个采样点。用于排除靠得太近的峰。最少是 1","type":"int","default":"None","required":false},"prominence":{"name":"prominence","meaning":"峰值突显度门槛","detail":"峰与其左右最低基线之间的高度差。高的 prominence 意味着峰更显著，不容易被噪声误触发。可传标量或 (min, max) 元组","type":"float, tuple","default":"None","required":false},"width":{"name":"width","meaning":"峰宽度门槛","detail":"峰的宽度（基线处的宽度）。可传标量或 (min, max)。常用于筛选显著峰","type":"float, tuple","default":"None","required":false},"threshold":{"name":"threshold","meaning":"峰与相邻点的高度差阈值","detail":"峰必须大于相邻点（左右均可）的最小差值。可传标量或 (min, max)","type":"float, tuple","default":"None","required":false},"plateau_size":{"name":"plateau_size","meaning":"峰顶平坦区域最小长度","detail":"峰顶平坦区域（多个相等高点）的最小采样数。0 表示不考虑 plateau","type":"int","default":"0","required":false}},"example":"import numpy as np\nfrom scipy.signal import find_peaks\n\nseries = np.array([1, 3, 2, 5, 1, 4, 1, 6, 1])\npeaks, properties = find_peaks(series, height=3, distance=2)\nprint(f\"peaks: {peaks}, heights: {properties['peak_heights']}\")","category":"signal","visualType":"scatter","visualNote":"峰值检测示意"},{"name":"interpolate.interp1d","desc":"一维插值","syntax":"scipy.interpolate.interp1d(x, y, kind='linear')","params":{"x":"已知数据点","y":"已知函数值","kind":"插值类型","fill_value":"外推或缺口位置的填充值"},"example":"import numpy as np\nfrom scipy.interpolate import interp1d\n\nx = np.array([0, 1, 2, 4, 6])\ny = np.array([0, 2, 3, 3.5, 5])\ninterp = interp1d(x, y, kind='cubic')\ngrid = np.linspace(0, 6, 25)\nprint(interp(grid)[:5])","category":"signal","visualType":"line","visualNote":"一维插值示意"},{"name":"interpolate.spline","desc":"样条插值","syntax":"scipy.interpolate.spline(x, y, xk, order=3)","params":{"order":"样条阶数"},"example":"import numpy as np\nfrom scipy.interpolate import spline\n\nx = np.array([0, 1, 2, 4, 6])\ny = np.array([0, 2, 3, 3.5, 5])\nxk = np.linspace(0, 6, 30)\nys = spline(x, y, xk)\nprint(ys[:5])","category":"signal","visualType":"line","visualNote":"样条插值示意"},{"name":"spatial.distance.cdist","desc":"计算距离矩阵","syntax":"scipy.spatial.distance.cdist(XA, XB, metric='euclidean')","params":{"XA":"第一组样本点矩阵","XB":"第二组样本点矩阵","metric":"距离度量方式"},"example":"import numpy as np\nfrom scipy.spatial.distance import cdist\n\nXA = np.array([[0, 0], [1, 1], [2, 2]])\nXB = np.array([[0, 1], [2, 1]])\nresult = cdist(XA, XB, metric='euclidean')\nprint(result)","category":"numeric","visualType":"heatmap","visualNote":"距离矩阵热力图示意"}],"seaborn":[{"name":"scatterplot","desc":"散点图","syntax":"sns.scatterplot(x=None, y=None, hue=None, style=None, size=None, data=None)","lib":"seaborn","docUrl":"https://seaborn.pydata.org/generated/seaborn.scatterplot.html","params":{"data":{"name":"data","meaning":"数据源 DataFrame","detail":"长格式数据框，每行是一个观测。x, y, hue 等参数指定列名","type":"DataFrame","default":"None","required":false},"x":{"name":"x","meaning":"x轴变量（列名或数据）","detail":"数据或列名。如果传入数据应是类数组，如果传字符串则从 data 中选取","type":"vector","default":"None","required":false},"y":{"name":"y","meaning":"y轴变量","detail":"数据或列名。沿用 x 的规则","type":"vector","default":"None","required":false},"hue":{"name":"hue","meaning":"分组着色变量","detail":"按该变量不同值用不同颜色绘制点。常用于显示第三维度，如类别","type":"vector","default":"None","required":false},"size":{"name":"size","meaning":"点大小映射变量","detail":"该变量值决定点的大小，可用于表示第四维度的数值变量","type":"vector","default":"None","required":false},"style":{"name":"style","meaning":"点样式映射变量","detail":"该变量值决定点的形状（圆、三角等），适合类别变量增加视觉区分","type":"vector","default":"None","required":false},"palette":{"name":"palette","meaning":"颜色板名称或字典","detail":"颜色方案，如 'muted', 'husl', 'Set2'。也可传 {变量值: 颜色} 字典显式指定","type":"str, dict","default":"None","required":false},"hue_order":{"name":"hue_order","meaning":"色调变量级别的绘制顺序","detail":"列表指定 hue 变量的 categorical 级别的顺序。默认按字母顺序或出现顺序","type":"list","default":"None","required":false},"hue_norm":{"name":"hue_norm","meaning":"数值色调归一化","detail":"当 hue 是连续变量时，(vmin, vmax) 元组用于将数据归一化到 [0, 1] 色彩范围","type":"tuple","default":"None","required":false},"sizes":{"name":"sizes","meaning":"点大小范围","detail":"(min, max) 元组，控制 size 变量映射的点大小范围。所有值在此区间内缩放","type":"tuple","default":"None","required":false},"size_order":{"name":"size_order","meaning":"大小级别绘制顺序","type":"list","default":"None","required":false},"size_norm":{"name":"size_norm","meaning":"大小归一化","detail":"当 size 是连续变量时的归一化范围 (vmin, vmax)","type":"tuple","default":"None","required":false},"markers":{"name":"markers","meaning":"样式标记列表","detail":"对应 style 变量的不同级别。如传 True 则用默认的轮换样式","type":"bool, list","default":"True","required":false},"style_order":{"name":"style_order","meaning":"样式级别绘制顺序","type":"list","default":"None","required":false},"alpha":{"name":"alpha","meaning":"透明度","detail":"点透明度，0-1 之间。方便叠加显示和显示密度","type":"float","default":"None","required":false},"legend":{"name":"legend","meaning":"图例显示方式","detail":"'brief' 自动精简图例，'full' 显示完整，'add' 添加，False 隐藏","type":"str","default":"'brief'","required":false},"ax":{"name":"ax","meaning":"绘图坐标系","detail":"在已有的 matplotlib Axes 上绘图，不指定则用当前 axes","type":"Axes","default":"None","required":false}},"example":"import seaborn as sns\nimport pandas as pd\ntips = sns.load_dataset('tips')\nsns.scatterplot(x='total_bill', y='tip', hue='smoker', data=tips)","category":"plot","visualType":"scatter","visualNote":"散点图示意"},{"name":"lineplot","desc":"折线图","syntax":"sns.lineplot(x=None, y=None, hue=None, style=None, data=None)","params":{"ci":"置信区间（None关闭）","markers":"是否显示标记点"},"example":"import seaborn as sns\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.DataFrame({'x': range(10), 'y': [2,4,3,5,4,6,5,7,6,8]})\nsns.lineplot(x='x', y='y', data=df)\nplt.tight_layout()\nplt.show()","category":"plot","visualType":"line","visualNote":"折线图示意"},{"name":"barplot","desc":"条形图（带置信区间）","syntax":"sns.barplot(x=None, y=None, hue=None, data=None, estimator='mean')","params":{"estimator":"聚合函数，默认mean","ci":"置信区间大小","palette":"调色板"},"example":"import seaborn as sns\nimport pandas as pd\ntips = sns.load_dataset('tips')\nsns.barplot(x='day', y='total_bill', data=tips, estimator=sum)","category":"plot","visualType":"bar","visualNote":"条形图示意"},{"name":"countplot","desc":"计数条形图","syntax":"sns.countplot(x=None, y=None, hue=None, data=None)","example":"import seaborn as sns\nimport pandas as pd\ntips = sns.load_dataset('tips')\nsns.countplot(x='day', data=tips)","category":"plot","visualType":"bar","visualNote":"计数条形图示意"},{"name":"boxplot","desc":"箱线图","syntax":"sns.boxplot(x=None, y=None, hue=None, data=None, orient='v')","params":{"orient":"'v'垂直，'h'水平","fliersize":"异常值点大小"},"example":"import seaborn as sns\nimport pandas as pd\ntips = sns.load_dataset('tips')\nsns.boxplot(x='day', y='total_bill', data=tips)","category":"plot","visualType":"box","visualNote":"箱线图示意"},{"name":"violinplot","desc":"小提琴图（箱线图+KDE）","syntax":"sns.violinplot(x=None, y=None, hue=None, data=None, split=False)","params":{"split":"是否在hue上分割","inner":"内部显示: 'box', 'quartile', 'stick'"},"example":"import seaborn as sns\nimport pandas as pd\niris = sns.load_dataset('iris')\nsns.violinplot(x='species', y='sepal_length', data=iris)","category":"plot","visualType":"box","visualNote":"小提琴图示意"},{"name":"histplot","desc":"直方图","syntax":"sns.histplot(data=None, x=None, y=None, kde=False, bins=None)","params":{"bins":"柱数量","kde":"是否显示核密度曲线","stat":"'count', 'density', 'probability'"},"example":"import seaborn as sns\nimport pandas as pd\ntips = sns.load_dataset('tips')\nsns.histplot(x='total_bill', data=tips, bins=30, kde=True)","category":"plot","visualType":"distribution","visualNote":"直方图示意"},{"name":"kdeplot","desc":"核密度估计图","syntax":"sns.kdeplot(x=None, y=None, data=None, shade=False)","params":{"shade":"是否填充下方区域","levels":"等高线数量"},"example":"import seaborn as sns\nimport numpy as np\ndata = np.random.randn(100)\nsns.kdeplot(x=data, shade=True)","category":"plot","visualType":"distribution","visualNote":"核密度估计图示意"},{"name":"heatmap","desc":"热力图","syntax":"sns.heatmap(data, vmin=None, vmax=None, cmap=None, annot=False, fmt='.2f')","lib":"seaborn","docUrl":"https://seaborn.pydata.org/generated/seaborn.heatmap.html","params":{"data":{"name":"data","meaning":"输入数据矩阵","detail":"2D 数据集，每行是一个观测，每列是一个变量。支持 pandas DataFrame 或 numpy 数组","type":"DataFrame, array","default":"None","required":true},"vmin":{"name":"vmin","meaning":"色彩映射范围下限","detail":"数据值映射到色彩范围的最小值。低于此的值都映射到 cmap 的最小色","type":"float","default":"None","required":false},"vmax":{"name":"vmax","meaning":"色彩映射范围上限","detail":"数据值映射到色彩范围的最大值，高于此的值都映射到 cmap 的最大色","type":"float","default":"None","required":false},"cmap":{"name":"cmap","meaning":"颜色映射方案","detail":"matplotlib 色图名称，如 'coolwarm', 'viridis', 'YlOrRd'。颜色应从浅到深对应数据低到高","type":"str","default":"None","required":false},"annot":{"name":"annot","meaning":"是否在每个单元格显示数值","detail":"True 所有单元格显示数值，False 不显示。也可传 DataFrame 显示不同列不同值，或传布尔矩阵有选择显示","type":"bool, DataFrame, array","default":"False","required":false},"fmt":{"name":"fmt","meaning":"数值格式字符串","detail":"当 annot=True 时，控制数值格式，如 '.2f' 两位小数，'d' 整数，'.1e' 科学计数法","type":"str","default":"'.2f'","required":false},"linewidths":{"name":"linewidths","meaning":"单元格间隔线宽度","detail":"在每个单元格之间画线，宽度越大分隔越明显。0 表示无分隔线","type":"float","default":"0","required":false},"linecolor":{"name":"linecolor","meaning":"分隔线颜色","detail":"linewidths > 0 时生效。指定线条颜色，默认为白色在彩色热力图上可能看不清","type":"str","default":"white","required":false},"cbar":{"name":"cbar","meaning":"是否显示颜色条","detail":"True（默认）显示侧边颜色条，表示数值与颜色的映射关系","type":"bool","default":"True","required":false},"cbar_kws":{"name":"cbar_kws","meaning":"颜色条的关键字参数","detail":"传入字典如 {'shrink': 0.8} 控制颜色条尺寸，传 {'label': 'value'} 添加标签","type":"dict","default":"None","required":false},"square":{"name":"square","meaning":"是否使单元格成正方形","detail":"True 时强制每个单元格是正方形，否则取决于Axes 比例","type":"bool","default":"False","required":false},"xticklabels":{"name":"xticklabels","meaning":"x轴刻度标签","detail":"True 显示列名，False 隐藏，'auto' 自动决定，或传字符串列表显式指定","type":"bool, str, list","default":"True","required":false},"yticklabels":{"name":"yticklabels","meaning":"y轴刻度标签","detail":"同上，控制行标签显示","type":"bool, str, list","default":"True","required":false},"mask":{"name":"mask","meaning":"遮罩矩阵","detail":"与 data 同形状的布尔矩阵，True 的位置显示为白色或透明，用于遮盖不需要显示的部分","type":"bool array","default":"None","required":false},"ax":{"name":"ax","meaning":"绘图坐标系","detail":"在已有的 Axes 上绘图，默认使用当前 axes","type":"Axes","default":"None","required":false},"kwargs":{"name":"kwargs","meaning":"其他matplotlib关键字参数","detail":"传给 pcolormesh 的其他关键字参数，如 'edgecolor' 设置边框颜色","type":"key-value","default":"None","required":false}},"example":"import seaborn as sns\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.DataFrame([[1,2,3],[4,5,6],[7,8,9]])\nsns.heatmap(df, annot=True, fmt='.0f', cmap='coolwarm')\nplt.show()","category":"plot","visualType":"heatmap","visualNote":"热力图示意"},{"name":"pairplot","desc":"配对图矩阵","syntax":"sns.pairplot(data, hue=None, vars=None, kind='scatter')","params":{"vars":"用于绘图的变量列表","kind":"'scatter', 'reg'","diag_kind":"'auto', 'hist', 'kde'"},"example":"import seaborn as sns\niris = sns.load_dataset('iris')\nsns.pairplot(iris, hue='species', vars=['sepal_length', 'sepal_width'])","category":"plot","visualType":"grid","visualNote":"配对图矩阵示意"},{"name":"relplot","desc":"关系图（可指定类型）","syntax":"sns.relplot(x=None, y=None, hue=None, kind='scatter', data=None)","params":{"kind":"'scatter'或'line'"},"example":"import seaborn as sns\nimport pandas as pd\ntips = sns. let currentLibrary = 'all';
let currentCategory = 'all';
let searchQuery = '';

function init() { renderNav(); renderCategoryBar(); renderCards(); updateStats(); }

function renderNav() {
    const navList = document.getElementById('navList');
    const total = Object.values(commands).reduce((a, b) => a + b.length, 0);
    let html = `<div class="nav-item ${currentLibrary === 'all' ? 'active' : ''}" onclick="selectLibrary('all')">全部<span class="count">${total}</span></div>`;
    ['pandas', 'numpy', 'scipy', 'seaborn', 'matplotlib'].forEach(lib => {
        if (commands[lib]) {
            html += `<div class="nav-item ${currentLibrary === lib ? 'active' : ''}" onclick="selectLibrary('${lib}')">${lib}<span class="count">${commands[lib].length}</span></div>`;
        }
    });
    navList.innerHTML = html;
}

function renderCategoryBar() {
    const bar = document.getElementById('categoryBar');
    let html = `<div class="category-chip ${currentCategory === 'all' ? 'active' : ''}" onclick="selectCategory('all')">全部</div>`;
    Object.entries(categories).forEach(([key, label]) => {
        html += `<div class="category-chip ${currentCategory === key ? 'active' : ''}" onclick="selectCategory('${key}')">${label}</div>`;
    });
    bar.innerHTML = html;
}

function selectLibrary(lib) { currentLibrary = lib; renderNav(); renderCards(); }
function selectCategory(cat) { currentCategory = cat; renderCategoryBar(); renderCards(); }
function clearSearch() { searchQuery = ''; document.getElementById('searchInput').value = ''; renderCards(); }

    return svgMap[type] || svgMap.table;
}

function renderCards() {
    const container = document.getElementById('cards');
    const libs = currentLibrary === 'all' ? Object.keys(commands) : [currentLibrary];
    let html = '';
    libs.forEach(lib => {
        if (!commands[lib]) return;
        commands[lib].forEach(cmd => {
            const q = searchQuery.toLowerCase();
            if (q && !cmd.name.toLowerCase().includes(q) && !cmd.desc.toLowerCase().includes(q)) return;
            if (currentCategory !== 'all' && cmd.category !== currentCategory) return;

            const visualHtml = cmd.visualType ? `<div class="chart-preview"><div class="chart-preview-title">图形示意</div>${buildVisualPreviewSvg(cmd.visualType)}<div class="chart-preview-note">${cmd.visualNote || ''}</div></div>` : '';
            const tipsHtml = cmd.tips && cmd.tips.length ? `<div class="tip-section"><div class="tip-title">使用提示</div><ul class="tip-list">${cmd.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>` : '';

            html += `
<div class="card" data-lib="${lib}" data-name="${cmd.name}" data-category="${cmd.category || ''}">
    <div class="card-header" onclick="toggleCard(this.parentElement)">
        <span class="card-title">${cmd.name}</span>
        <div class="card-meta">
            <span class="badge badge-library">${lib}</span>
            ${cmd.category ? `<span class="badge badge-category">${categories[cmd.category] || cmd.category}</span>` : ''}
            <div class="card-actions">
                <button class="btn" onclick="event.stopPropagation(); copyCode(this, '${escapeForJS(cmd.example)}')">复制</button>
            </div>
        </div>
    </div>
    <div class="card-desc">${cmd.desc}</div>
    <div class="card-syntax">${escapeHtml(cmd.syntax)}</div>
    <div class="card-detail">
        ${getParamsHtml(cmd)}
        ${tipsHtml}
        <div class="card-example-label">示例代码</div>
        <pre class="card-example">${escapeHtml(cmd.example)}</pre>
        ${visualHtml}
    </div>
</div>`;
        });
    });
    if (!html) html = '<div class="empty-state"><h3>没有找到匹配的命令</h3><p>尝试其他关键词或切换库/分类</p></div>';
    container.innerHTML = html;
    updateStats();
}

function getParamsHtml(cmd) {
    if (!cmd.params) return '';

    // 获取核心参数（前3-5个最重要参数）和完整参数列表
    const allParamKeys = Object.keys(cmd.params);
    const priorityParams = allParamKeys.slice(0, 5); // 前5个为核心参数
    const fullParams = allParamKeys.slice(5); // 剩余为完整参数

    let html = '<div class="card-detail-title">📌 学习优先参数</div>';
    html += '<p style="font-size:11px;color:var(--muted);margin:6px 0 12px;">以下为最常用参数，想看完整参数请展开底部「查看完整参数」。</p>';
    html += '<div class="priority-params">';

    priorityParams.forEach(k => {
        const p = cmd.params[k];
        html += renderParamCard(k, p, false);
    });
    html += '</div>';

    // 添加查看完整参数的折叠区
    if (fullParams.length > 0) {
        html += `
            <button class="full-params-toggle" onclick="toggleFullParams(this)">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                查看完整参数 (${fullParams.length} 个)
            </button>
            <div class="full-params-section">
                <p class="full-params-note">💡 以下为完整官方参数说明，参考各库官方文档。</p>
                <div class="full-params-list">`;
        fullParams.forEach(k => {
            const p = cmd.params[k];
            html += renderParamCard(k, p, true);
        });
        html += '</div></div>';
    }

    // 添加官方文档链接
    const docUrl = cmd.docUrl || libraryDocUrls[cmd.lib] || libraryMeta[cmd.lib]?.docUrl || '';
    if (docUrl) {
        html += `<a href="${docUrl}" target="_blank" class="official-link" style="margin-top:12px;">
            🔗 查看官方完整文档
        </a>`;
    }

    return html;
}

function renderParamCard(key, param, isFull) {
    // param 可以是字符串也可以是对象
    let name = key;
    let meaning = '';
    let detail = '';
    let type = 'any';
    let defaultVal = null;
    let required = false;

    if (typeof param === 'string') {
        meaning = param;
    } else if (typeof param === 'object') {
        name = param.name || key;
        meaning = param.meaning || param.desc || '';
        detail = param.detail || param.desc || '';
        type = param.type || 'any';
        defaultVal = param.default || param.defaultValue || null;
        required = param.required || false;
    }

    // 确定类型标签
    const typeColors = {
        'str': '#8e44ad', 'string': '#8e44ad',
        'int': '#2980b9', 'integer': '#2980b9',
        'float': '#27ae60', 'bool': '#e74c3c', 'boolean': '#e74c3c',
        'array': '#f39c12', 'list': '#f39c12', 'dict': '#16a085',
        'DataFrame': '#1f6f78', 'Series': '#1f6f78'
    };
    const typeColor = typeColors[type] || 'var(--muted)';
    const typeLabel = type === 'any' ? '' : `<span class="param-type-tag" style="background:${typeColor}20;color:${typeColor}">${type}</span>`;
    const requiredBadge = required ? '<span class="param-required-badge">必需</span>' : '<span class="param-optional-badge">可选</span>';
    const defaultHtml = defaultVal !== null ? `<span class="param-default">默认值: ${defaultVal}</span>` : '';

    return `
        <div class="param-card">
            <div class="param-header">
                <span class="param-name-tag">${name}</span>
                ${typeLabel}
                ${requiredBadge}
                ${defaultHtml}
            </div>
            ${meaning ? `<p class="param-meaning">${escapeHtml(meaning)}</p>` : ''}
            ${detail ? `<p class="param-detail">${escapeHtml(detail)}</p>` : ''}
        </div>
    `;
}

function toggleFullParams(btn) {
    btn.classList.toggle('expanded');
    const section = btn.nextElementSibling;
    section.classList.toggle('expanded');
}

function toggleCard(card) { card.classList.toggle('expanded'); }

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function escapeForJS(text) {
    if (!text) return '';
    return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
}

function copyCode(btn, code) {
    const text = code.replace(/\\n/g, '\n').replace(/\\'/g, "'").replace(/\\\\/g, '\\');
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '已复制!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
    }).catch(() => {
        btn.textContent = '失败';
        setTimeout(() => btn.textContent = '复制', 1500);
    });
}

function updateStats() {
    const total = Object.values(commands).reduce((a, b) => a + b.length, 0);
    const filtered = document.querySelectorAll('.card').length;
    document.getElementById('stats').textContent = `显示 ${filtered} / 共 ${total} 个命令`;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderCards();
});

init();
</script>
